function render(){let views={discover,saved:savedView,stores:storesView,reels,location:locationView,appearance,login:()=>login(false),adminLogin:()=>login(true),register,owner:ownerView,admin:adminView};content.innerHTML=(views[page]||discover)();bottom.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===page));if(page==='register')updatePin();if(page==='reels')reelProgress=0}
function modal(h){overlay.innerHTML='<div class="modalLayer" id="modalLayer"><div class="modal">'+h+'</div></div>'}function close(){overlay.innerHTML=''}function detail(p){if(!p)return;let s=stores[p.store],metalValue=rates[p.metal]*purity(p.purity)*p.weight,surplus=s.surplus*p.weight;modal('<div class="between"><h2>'+esc(p.name)+'</h2><button class="iconBtn" data-close>×</button></div><div class="productArt" style="height:180px;border-radius:13px;margin:14px 0">'+p.art+'</div><div class="eyebrow">'+p.metal+' · '+p.purity+'</div><h2 style="margin:7px 0;color:var(--accent)">'+fmt(price(p))+'</h2><p class="small muted">'+esc(p.description)+'</p><div style="margin:11px 0">'+p.tags.map(tag).join('')+'</div><div class="panel"><h3>Weight & local units</h3><p class="small" style="margin:9px 0">'+p.weight+' grams</p>'+units.map(u=>'<div class="between small item"><span>'+esc(u.name)+'</span><strong>'+(+(p.weight/u.grams).toFixed(4))+' '+esc(u.name)+'</strong></div>').join('')+'</div><div class="panel"><h3>Price breakdown</h3>'+[['Pure rate',fmt(rates[p.metal])+'/g'],['Purity',(purity(p.purity)*100).toFixed(2)+'%'],['Metal value',fmt(metalValue)],['Store surplus',fmt(surplus)],['Making charge',fmt(p.making)],['Fixed charge',fmt(p.fixed)]].map(x=>'<div class="between small item"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><div class="between"><span class="small muted">'+esc(s.name)+'</span><button class="btn" data-store="'+p.store+'">View store →</button></div>')}
function storeDetail(i){let s=stores[i];modal('<div class="between"><h2>'+esc(s.name)+'</h2><button class="iconBtn" data-close>×</button></div><p class="small muted" style="margin-top:12px">'+esc(s.address)+' · '+dist(s).toFixed(1)+' km away</p>'+status(s.verified?'Verified':'Pending')+'<p class="small">Store surplus: '+fmt(s.surplus)+'/g</p><button class="btn" data-browse="'+i+'">Browse products →</button>')}
function productEditor(p){modal('<div class="between"><h2>'+(p?'Edit jewellery':'Add jewellery')+'</h2><button class="iconBtn" data-close>×</button></div>'+field('pName','Product name',p?.name||'')+'<div class="cols"><div><label>Category</label><select class="field" id="pCategory">'+['Necklaces','Earrings','Rings','Bangles','Bracelets'].map(c=>'<option '+(p?.category===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div><label>Metal</label><select class="field" id="pMetal">'+['Gold','Silver'].map(c=>'<option '+(p?.metal===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div><label>Purity</label><select class="field" id="pPurity">'+['24K','22K','18K','925'].map(c=>'<option '+(p?.purity===c?'selected':'')+'>'+c+'</option>').join('')+'</select></div><div>'+field('pWeight','Weight / g',p?.weight||'','number')+'</div><div>'+field('pMaking','Making charge',p?.making??0,'number')+'</div><div>'+field('pFixed','Fixed charge',p?.fixed??0,'number')+'</div></div>'+field('pTags','Tags, comma separated',p?.tags.join(', ')||'')+'<label>Description</label><textarea class="field" id="pDescription" rows="3">'+esc(p?.description||'')+'</textarea><button class="btn" data-save-product="'+(p?.id||'new')+'" style="margin-top:12px">Save draft</button>')}
function updatePin(){let a=$('#regLat'),b=$('#regLon'),pin=$('#regPin');if(!a||!b||!pin)return;let lat=+a.value,lon=+b.value;pin.style.left=Math.max(5,Math.min(95,50+(lon-85.311)*150))+'%';pin.style.top=Math.max(8,Math.min(92,50-(lat-27.704)*150))+'%'}function asyncRefresh(){const token=++renderToken;loading=true;render();setTimeout(()=>{if(token!==renderToken)return;loading=false;render()},180)}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||!app.contains(b))return;let d=b.dataset;if(d.go){go(d.go);return}if(d.back!==undefined){go(previous);return}if(d.close!==undefined){close();return}if(d.slide!==undefined){slide=(slide+Number(d.slide)+6)%6;render();return}if(d.dot!==undefined){slide=+d.dot;render();return}if(d.bannerAction!==undefined){let id=banners[slide][3];if(id===0)go('stores');else detail(products.find(p=>p.id===id));return}if(d.category){cat=d.category;limit=6;asyncRefresh();return}if(d.filters!==undefined){filters=!filters;render();return}if(d.reset!==undefined){cat='All';metal='';sort='near';radius=50;search='';limit=6;asyncRefresh();return}if(d.more!==undefined){limit+=6;asyncRefresh();return}if(d.save!==undefined){let id=+d.save;saved.has(id)?saved.delete(id):saved.add(id);render();toast(saved.has(id)?'Added to saved jewellery':'Removed from saved');return}if(d.detail!==undefined){detail(products.find(p=>p.id===+d.detail));return}if(d.store!==undefined){storeDetail(+d.store);return}if(d.browse!==undefined){search=stores[+d.browse].name;close();go('discover');return}if(d.locationApply!==undefined){loc=$('#locationSelect').value;toast('Location updated');go('discover');return}if(d.theme){setTheme(d.theme);toast('Appearance: '+d.theme);return}if(d.enter){if(d.enter==='admin'){adminTab='Overview';go('admin')}else{owner=0;ownerTab='Overview';go('owner')}return}if(d.ownerTab){ownerTab=d.ownerTab;render();return}if(d.adminTab){adminTab=d.adminTab;render();return}if(d.newProduct!==undefined){if(!stores[owner].verified)return toast('Store verification required');if(products.filter(p=>p.store===owner).length>=plans[stores[owner].plan][0])return toast('Plan product limit reached');productEditor(null);return}if(d.editProduct!==undefined){let p=products.find(p=>p.id===+d.editProduct);if(p.blocked)return toast('Administrator restriction must be lifted');productEditor(p);return}if(d.saveProduct!==undefined){let name=$('#pName').value.trim(),weight=+$('#pWeight').value,making=+$('#pMaking').value,fixed=+$('#pFixed').value,mt=$('#pMetal').value,pu=$('#pPurity').value;if(!name||!(weight>0)||making<0||fixed<0||(mt==='Silver'&&pu!=='925')||(mt==='Gold'&&pu==='925'))return toast('Check name, weight, charges and purity');let p=d.saveProduct==='new'?null:products.find(p=>p.id===+d.saveProduct);let data={name,weight,making,fixed,metal:mt,purity:pu,category:$('#pCategory').value,tags:$('#pTags').value.split(',').map(x=>x.trim()).filter(Boolean),description:$('#pDescription').value.trim(),status:'Draft'};if(p)Object.assign(p,data);else products.push({id:Math.max(...products.map(p=>p.id))+1,...data,store:owner,blocked:false,images:0,reels:0,featured:false,art:'💎'});log('Product draft saved: '+name);close();render();toast('Draft saved');return}if(d.publish!==undefined){let p=products.find(p=>p.id===+d.publish),s=stores[p.store];if(p.blocked||['Archived','Suspended'].includes(p.status))return toast('Admin restriction prevents publishing');if(p.status==='Published')p.status='Draft';else{if(!s.verified||!s.active)return toast('Store verification required');if(!p.images)return toast('Add an image first');p.status='Published'}log('Owner changed publication: '+p.name+' → '+p.status);render();toast('Product '+p.status.toLowerCase());return}if(d.media!==undefined){let p=products.find(p=>p.id===+d.media);modal('<div class="between"><h2>Media · '+esc(p.name)+'</h2><button class="iconBtn" data-close>×</button></div><label>Images</label><input class="field" type="file" accept="image/*" multiple><label>Reel</label><input class="field" type="file" accept="video/mp4">'+note('File upload is simulated. Real processing, duration and file-size validation require a backend.')+'<div class="row"><button class="btn" data-add-image="'+p.id+'">Simulate image</button><button class="ghost" data-add-reel="'+p.id+'">Simulate reel</button></div>');return}if(d.addImage!==undefined){let p=products.find(p=>p.id===+d.addImage);p.images++;log('Image added: '+p.name);close();render();toast('Image count updated');return}if(d.addReel!==undefined){let p=products.find(p=>p.id===+d.addReel);if(p.reels>=plans[stores[p.store].plan][1])return toast('Reel limit reached');p.reels++;log('Reel added: '+p.name);close();render();toast('Reel count updated');return}if(d.verify!==undefined){let s=stores[+d.verify];s.verified=!s.verified;log('Store verification changed: '+s.name);render();toast('Verification updated');return}if(d.suspendStore!==undefined){let s=stores[+d.suspendStore];s.active=!s.active;log('Store operational status changed: '+s.name);render();return}if(d.archive!==undefined){let p=products.find(p=>p.id===+d.archive);if(p.status==='Archived'){p.status='Draft';p.blocked=false}else{p.status='Archived';p.blocked=true;p.featured=false}log('Admin changed archive status: '+p.name);render();return}if(d.suspendProduct!==undefined){let p=products.find(p=>p.id===+d.suspendProduct);if(p.status==='Suspended'){p.status='Draft';p.blocked=false}else{p.status='Suspended';p.blocked=true;p.featured=false}log('Admin changed product suspension: '+p.name);render();return}if(d.cyclePlan!==undefined){let s=stores[+d.cyclePlan],a=['Free','Standard','Premium'];s.plan=a[(a.indexOf(s.plan)+1)%3];log('Subscription changed: '+s.name+' → '+s.plan);render();return}if(d.approveUpgrade!==undefined){let u=upgrades[+d.approveUpgrade];u.status='Approved';stores[u.store].plan=u.plan;log('Upgrade approved: '+stores[u.store].name);render();return}if(d.approveFeature!==undefined){let f=features[+d.approveFeature],p=products.find(p=>p.id===f.product);if(!publicProduct(p))return toast('Product is not eligible');f.status='Approved';p.featured=true;log('Featured approved: '+p.name);render();return}if(d.deleteUnit!==undefined){let u=units.find(u=>u.id===+d.deleteUnit);units=units.filter(x=>x.id!==+d.deleteUnit);unitHistory.unshift('Removed '+u.name);log('Unit removed: '+u.name);render();toast('Unit removed');return}if(d.reelNext!==undefined){nextReel(1);return}if(d.reelPrev!==undefined){nextReel(-1);return}if(d.reelPause!==undefined){reelPaused=!reelPaused;render();return}if(d.reelLike!==undefined){b.textContent=b.textContent==='♡'?'♥':'♡';return}if(d.register!==undefined){let name=$('#regStore').value.trim(),person=$('#regOwner').value.trim(),phone=$('#regPhone').value.trim(),lat=+$('#regLat').value,lon=+$('#regLon').value,surplus=+$('#regSurplus').value;if(!name||!person||!phone||!$('#regPass').value||!$('#regLat').value||!$('#regLon').value||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180||surplus<0)return toast('Complete required registration fields');if(stores.some(s=>s.phone===phone))return toast('Phone already registered');stores.push({name,owner:person,phone,address:$('#regAddress').value.trim(),lat,lon,surplus,verified:false,active:true,plan:'Free'});owner=stores.length-1;ownerTab='Overview';log('New store registered: '+name);go('owner');toast('Registration submitted · verification pending');return}if(d.saveProfile!==undefined){let s=stores[owner],name=$('#profileName').value.trim(),surplus=+$('#profileSurplus').value,lat=+$('#profileLat').value,lon=+$('#profileLon').value;if(!name||surplus<0||Math.abs(lat)>90||Math.abs(lon)>180)return toast('Check store information');Object.assign(s,{name,surplus,lat,lon,address:$('#profileAddress').value.trim()});log('Store profile updated: '+name);render();toast('Profile updated');return}if(d.upgrade!==undefined){let tier=$('#upgradePlan').value;if(stores[owner].plan===tier)return toast('Already on this plan');upgrades.push({store:owner,plan:tier,status:'Pending'});log('Upgrade requested: '+stores[owner].name);render();toast('Request submitted');return}if(d.featureRequest!==undefined){let id=+$('#featProduct').value,date=$('#featDate').value,hours=+$('#featHours').value;if(!id||!date||!plans[stores[owner].plan][2])return toast('Choose an eligible product, date and plan');let p=products.find(p=>p.id===id);features.push({store:owner,product:id,name:p.name,date,hours,status:'Pending'});log('Featured request: '+p.name);render();toast('Featured request submitted');return}if(d.saveRates!==undefined){let g=+$('#goldRate').value,s=+$('#silverRate').value;if(!(g>0&&s>0))return toast('Rates must be positive');rates={Gold:g,Silver:s};rateHistory.unshift({gold:g,silver:s,reason:$('#rateReason').value.trim(),time:new Date().toLocaleString()});log('Admin published new metal rates');render();toast('Rates updated');return}if(d.addUnit!==undefined){let name=$('#unitName').value.trim(),grams=+$('#unitGrams').value;if(!name||!(grams>0)||!Number.isFinite(grams)||units.some(u=>u.name.toLowerCase()===name.toLowerCase()))return toast('Enter a unique name and positive gram equivalent');let id=Math.max(0,...units.map(u=>u.id))+1;units.push({id,name,grams});unitHistory.unshift('Added '+name+' = '+grams+'g');log('Admin created unit: '+name+' = '+grams+'g');render();toast('Unit added to product details');return}});
app.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value.toLowerCase();let caret=e.target.selectionStart;let a=filtered();let grid=$('.grid');if(grid){grid.innerHTML=a.slice(0,limit).map(card).join('')||'<div class="empty">No matching jewellery</div>'}let count=$('.sectionHead .small.muted');if(count)count.textContent=a.length+' results';return}if(e.target.id==='regLat'||e.target.id==='regLon')updatePin()});app.addEventListener('change',e=>{if(e.target.id==='metalFilter'){metal=e.target.value;asyncRefresh()}if(e.target.id==='radiusFilter'){radius=+e.target.value;asyncRefresh()}if(e.target.id==='sortFilter'){sort=e.target.value;asyncRefresh()}});app.addEventListener('click',e=>{if(e.target.id==='modalLayer')close();if(e.target.id==='registrationMap'||e.target.closest('#registrationMap')&&!e.target.closest('input,button')){let r=$('#registrationMap').getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;$('#regLat').value=(27.704+(0.5-y)*.13).toFixed(6);$('#regLon').value=(85.311+(x-.5)*.13).toFixed(6);updatePin()}});
function nextReel(dir){let a=products.filter(p=>publicProduct(p)&&p.reels>0);if(!a.length)return;reelIndex=(reelIndex+dir+a.length)%a.length;reelProgress=0;render()}let swipeY=0;app.addEventListener('touchstart',e=>{if(e.target.closest('#reel'))swipeY=e.touches[0].clientY},{passive:true});app.addEventListener('touchend',e=>{if(e.target.closest('#reel')){let dy=e.changedTouches[0].clientY-swipeY;if(Math.abs(dy)>45)nextReel(dy<0?1:-1)}},{passive:true});app.addEventListener('wheel',e=>{if(e.target.closest('#reel')&&Math.abs(e.deltaY)>20){e.preventDefault();nextReel(e.deltaY>0?1:-1)}},{passive:false});setInterval(()=>{if(theme==='adaptive'){let n=nepalClock();if(n.phase!==phase){phase=n.phase;setTheme('adaptive')}}if(page==='discover'&&!overlay.innerHTML){slide=(slide+1)%banners.length;let hero=$('.hero');if(hero){hero.outerHTML=bannerHTML().match(/<div class="hero">[\s\S]*?<div class="dots">/)[0].replace('<div class="dots">','');let dots=$('.dots');if(dots)dots.innerHTML=banners.map((_,i)=>'<button class="'+(i===slide?'active':'')+'" data-dot="'+i+'"></button>').join('')}}},6500);setInterval(()=>{if(page!=='reels'||reelPaused||overlay.innerHTML)return;reelProgress+=1.5;let bar=$('#reelProgress');if(bar)bar.style.width=reelProgress+'%';if(reelProgress>=100)nextReel(1)},100);setTheme('adaptive');render();})();
</script></body></html>
