services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: hamro
      POSTGRES_USER: hamro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hamro -d hamro']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hamro:${POSTGRES_PASSWORD}@db:5432/hamro
      MEDIA_ROOT: /data/media
      TRUST_PROXY: '1'
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: [python, -m, flask, --app, wsgi, worker]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hamro:${POSTGRES_PASSWORD}@db:5432/hamro
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    cpus: 2
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
volumes:
  pgdata:
  media:
