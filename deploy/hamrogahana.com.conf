# Install on the VPS host as /etc/nginx/sites-available/hamrogahana.com.
# Certbot's --nginx command adds HTTPS and the HTTP-to-HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name hamrogahana.com www.hamrogahana.com;

    client_max_body_size 102m;

    location / {
        # Match APP_PORT in the project's .env if you change its default.
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite user-supplied headers at this public trust boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 130s;
    }
}
