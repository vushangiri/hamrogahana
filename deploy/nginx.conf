# This listener is published on loopback only. An optional trusted host proxy
# must overwrite forwarding headers; never expose this port publicly.
map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    http http;
    https https;
}
map $http_x_forwarded_for $original_client {
    "" $remote_addr;
    default $http_x_forwarded_for;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 102m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $original_client;
        # Collapse the trusted host-proxy chain to one value for ProxyFix(x_for=1).
        proxy_set_header X-Forwarded-For $original_client;
        proxy_set_header X-Forwarded-Proto $original_scheme;
        proxy_read_timeout 130s;
    }
}
